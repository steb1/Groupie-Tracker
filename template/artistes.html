<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <title>Artistes</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" type="text/css" href="./css/style.css?v=1.0">
    <link rel="stylesheet" type="text/css" href="./css/style1.css?v=1.0">
    <title>Hello, world!</title>
  </head>
<body class="container-flex"> 
        <nav class="navbar">
          <img class="logo" src="./css/logo.png">
          <ul>
            <li><a  href="/">Home</a></li>
            <li><a class="active" href="#">Artistes</a></li>
          </ul>
        </nav>
   
      {{range .}}
      <a href="/ArtisteDetail?ID={{.ID}} ">
        <div class="card">
            <img src={{.Image}} class="img">
            <div class="intro">
                <h1>{{.Name}}</h1>
                <p class="p"><span>Members : </span>
                {{range .Members}} 
                <span class="Members">{{.}}.</span>
                {{end}}
                </p>
            </div>
            View More</a>
          </div>
        </a>
        {{end}}
</body>
