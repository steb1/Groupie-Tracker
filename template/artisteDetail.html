<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/template/css/style2.css">
    <title>Document</title>
</head>
<body>

<nav class="navbar">
    <img class="logo" src="./css/logo.png">
    <ul>
      <li><a href="/">Home</a></li>
      <li><a href="/Artiste">Artistes</a></li>
      <li><a class="active" href="#"></a></li>
    </ul>
  </nav>
{{range .Artistes}}
  <div class="card">
    <div class="img-bx">
      <img src={{.Image}} alt="img" />
    </div>
    <div class="content">
        {{.Name}}
      <div class="detail">
       {{.CreationDate}}
      </div>
    </div>
  </div>
{{end}}
{{range .Locations.Index}} 
<div>{{range .Locations}} 
  <div>{{.}} </div>
  {{end}}
</div>
{{end}}
</body>
</html>
