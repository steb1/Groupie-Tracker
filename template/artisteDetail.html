<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" type="text/css" href="./css/style2.css?v=1.0">
    <title>{{.Name}} </title>
  </head>
  <body>
    <nav class="navbar">
      <img class="logo" src="./css/logo.png">
      <ul>
        <li><a href="/">Home</a></li>
        <li><a href="/Artiste">Artistes</a></li>
        <li><a class="active" href="#">{{.Name}}</a></li>
      </ul>
    </nav>
    <div class="card">
      <div class="img-bx">
        <img src={{.Image}} alt="img" />
      </div>
      <div class="content">
        <div class="detail">
          <h2>{{.Name}}<br /><span>{{.CreationDate}}</span></h2>
          
        </div>
      </div>
    </div>
  </body>
</html>
